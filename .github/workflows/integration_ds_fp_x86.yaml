name: Datastream x datastream Integration on X86
on:
  workflow_dispatch:
    inputs:
      ds_tag:
        description: 'DS Docker version tag which you want to test with'
        required: false
        default: ''
        type: string
      fp_tag:
        description: 'FP Docker version tag which you want to test with'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - 'docker/**'
      - 'src/datastreamcli/**'
      - 'tests/**'
      - '!src/datastreamcli/README.md'
      - '.github/workflows/integration_ds_fp_x86.yaml'
  pull_request:
    paths:
      - 'docker/**'
      - 'src/datastreamcli/**'
      - 'tests/**'
      - '!src/datastreamcli/README.md'
      - '.github/workflows/integration_ds_fp_x86.yaml'
  
permissions:
  id-token: write
  contents: read
  security-events: write

jobs:
  build-test-docker-x86:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKERHUB_USERNAME}}
        password: ${{secrets.DOCKERHUB_TOKEN}}        

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: us-east-1

    - name: Build docker containers
      # Pass user-controllable values via env (not ${{ }} inline) to avoid
      # shell injection through workflow_dispatch inputs and PR-controlled
      # refs like github.head_ref / pull_request.head.sha.
      env:
        FP_TAG_INPUT: ${{ inputs.fp_tag }}
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_AFTER: ${{ github.sha }}
      run : |
        if [ -z "$FP_TAG_INPUT" ]; then
          echo "FP_TAG input not provided, building datastream containers..."
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF=$(git diff --name-only "$PR_BASE_SHA"..."$PR_HEAD_SHA")
          elif [ "$EVENT_NAME" = "push" ]; then
            DIFF=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_AFTER")
          else
            DIFF=$(git diff --name-only origin/main...HEAD)
          fi
          if echo "$DIFF" | grep -q "docker/Dockerfile.datastream-deps"; then
            echo "Deps Dockerfile changed, building deps..."
            TAG=latest-x86 docker compose -f docker/docker-compose.yml build datastream-deps
          else
            echo "Deps Dockerfile unchanged, pulling from Docker Hub..."
            docker pull awiciroh/datastream-deps:latest-x86
          fi
          TAG=latest-x86 docker compose -f docker/docker-compose.yml build datastream
        else
          echo "FP_TAG input provided ($FP_TAG_INPUT), skipping datastream build and using existing images..."
        fi

    - name: Test docker containers
      env:
        DS_TAG: ${{ inputs.ds_tag || 'latest-x86' }}
        FP_TAG: ${{ inputs.fp_tag || 'latest-x86' }}
      run : |
        docker images
        curl -L -O https://ciroh-community-ngen-datastream.s3.amazonaws.com/resources/v2.1_hydrofabric/geopackages/test_data/palisade.gpkg
        ./scripts/datastream -s 202006200100 -e 202006200200 -C NWM_RETRO_V3 -d $(pwd)/data/datastream_test -g $(pwd)/palisade.gpkg -R $(pwd)/configs/ngen/realization_sloth_nom_cfe_pet.json
